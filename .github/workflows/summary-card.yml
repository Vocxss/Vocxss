name: GitHub-Profile-Summary-Cards

on:
  schedule: # Mengeksekusi setiap hari pada jam 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Memungkinkan menjalankan manual
  push:
    branches:
      - main

jobs:
  build: # Sekarang menjorok ke dalam
    runs-on: ubuntu-latest
    name: generate-github-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3 # Disarankan update ke v3 atau v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_SUMMARY_CARDS_TOKEN }} # Gunakan nama secret tanpa kurung siku
        with:
          USERNAME: ${{ github.repository_owner }}
